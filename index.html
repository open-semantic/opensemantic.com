    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is semantic data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Semantic data provides reliable business context for humans and agents. Tables and columns describe how data is stored, but not what it means. Semantic data adds that meaning: the business concepts and how they relate, how metrics like revenue or churn are calculated, and who owns a data product and guarantees its quality."
          }
        },
        {
          "@type": "Question",
          "name": "What is Apache Ossie?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Apache Ossie (incubating) is an industry-driven, vendor-neutral open standard for semantic data. It defines YAML and JSON formats for ontologies and semantic models, so that business definitions stay consistent as they are exchanged between AI agents, BI platforms, and analytics tools. It is developed under Apache Software Foundation governance and licensed under the Apache License 2.0."
          }
        },
        {
          "@type": "Question",
          "name": "Is Apache Ossie the same as Open Semantic Interchange (OSI)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Open Semantic Interchange (OSI) was launched by Snowflake and partners in September 2025. In July 2026 the project entered the Apache Incubator and was renamed Apache Ossie to avoid confusion with other projects that share the OSI acronym."
          }
        },
        {
          "@type": "Question",
          "name": "What is an Apache Ossie ontology?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An Ossie ontology is a conceptual model of the business. It defines concepts (entity types and value types), relationships between them with multiplicities and verbalizations, and business rules (requires and derived_by expressions). Ontology mappings connect concepts and relationships to the datasets and fields of an Ossie semantic model."
          }
        },
        {
          "@type": "Question",
          "name": "What does an Apache Ossie semantic model include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An Ossie semantic model includes datasets (logical fact and dimension tables with fields), relationships (foreign key connections between datasets), metrics (aggregate business measures like revenue and order count), AI context (instructions, synonyms, and examples for AI agents), and custom extensions for vendor-specific metadata."
          }
        },
        {
          "@type": "Question",
          "name": "How do Apache Ossie, ODPS, and ODCS fit together?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Apache Ossie ontologies and semantic models describe what data means. The Bitol standards describe the data that is delivered: the Open Data Product Standard (ODPS) defines a data product with its owner and output ports, and the Open Data Contract Standard (ODCS) defines the schema, quality rules, SLAs, and AI context of each output port. ODCS authoritative definitions can link tables and columns to ontology concepts."
          }
        },
        {
          "@type": "Question",
          "name": "What platforms does Apache Ossie support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ossie supports multi-dialect expressions for ANSI SQL, Snowflake, Databricks, Tableau, and MDX, with BigQuery, DAX, MAQL, Sigma, ThoughtSpot, and a portable Ossie SQL dialect added in version 0.2.0. Vendor-specific metadata for Snowflake, Salesforce, dbt, Databricks, GoodData, and others is stored in custom extensions."
          }
        },
        {
          "@type": "Question",
          "name": "How does Apache Ossie differ from vendor-specific semantic layers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Unlike vendor-specific semantic layers, Ossie is a vendor-neutral specification that can be translated to and from any platform. This prevents metadata lock-in and lets the same definitions feed AI, data, BI, and software platforms."
          }
        }
      ]
    }
    </script>
